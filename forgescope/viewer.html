<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForgeScope · Evidence before edits</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#131c29;--line:#26364b;--text:#e9eff6;--muted:#a4b3c6;--mint:#a6efac;--amber:#f2c37d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}body.light{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--line:#d3dce6;--text:#172538;--muted:#4a6077;--mint:#24743b;--amber:#8b5300}header{border-bottom:1px solid var(--line);padding:22px 4vw;display:flex;align-items:center;gap:20px}.logo{font-weight:800;font-size:22px;letter-spacing:-1px}.logo span{color:var(--mint)}.tag{color:var(--muted);font-size:13px}.controls{margin-left:auto;display:flex;gap:10px}button,select,input{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:7px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--mint)}main{max-width:1450px;margin:auto;padding:38px 4vw}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-1.8px;margin:10px 0 12px}h2{font-size:19px;margin-top:0}p{line-height:1.6}.eyebrow{color:var(--mint);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700}.sub{max-width:800px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:28px 0}.stat,.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:22px}.stat strong{display:block;font-size:30px}.stat span{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.wide{grid-column:1/-1}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;font-size:11px;border:1px solid var(--line);border-radius:4px;margin-right:6px}.high{color:var(--amber)}.ok{color:var(--mint)}#map{width:100%;height:290px}svg text{font:12px system-ui;fill:var(--text)}.scroll{overflow:auto;max-height:410px}li{padding:8px 0;line-height:1.5}code{overflow-wrap:anywhere;color:var(--mint)}.filters{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}.finding{padding:18px 0;border-top:1px solid var(--line)}.finding h3{font-size:16px;margin:9px 0}.finding p{font-size:13px;margin:7px 0}.finding summary{cursor:pointer}.chain{border-left:2px solid var(--mint);padding:8px 12px;margin:10px 0;font-size:13px}a{color:var(--mint)}.footer{font-size:12px;color:var(--muted);padding:30px 0}#status{font-size:12px;color:var(--muted)}.tool{padding:10px 0}.tool p{font-size:13px;margin:5px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header .tag{display:none}main{padding:25px 20px}.controls{gap:5px}#map{height:360px}}
</style>
<header><div class="logo">Forge<span>Scope</span></div><div class="tag">Evidence before edits.</div><div class="controls"><select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option></select><button id="theme" aria-label="Toggle theme">◐</button><button id="download">JSON ↓</button></div></header>
<main><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p class="sub" id="intro"></p><div id="status"></div><div class="stats" id="stats"></div>
<div class="layout"><section class="card"><h2 id="mapTitle"></h2><label id="selectLabel" for="seed"></label> <select id="seed"></select><svg id="map" role="img" aria-label="Python import dependency map"></svg><div class="muted" id="mapNote"></div><div id="chains" class="scroll"></div></section>
<section class="card"><h2 id="testsTitle"></h2><div id="tests"></div><h2 style="margin-top:28px" id="enginesTitle"></h2><div id="engines"></div></section>
<section class="card wide"><h2 id="findingsTitle"></h2><div class="filters"><input id="search" aria-label="Search findings" placeholder="Search evidence"><select id="filter" aria-label="Engine"><option value="all">All engines</option><option>patchscope</option><option>cifuse</option><option>devrescue</option><option>reporelief</option></select><label><input type="checkbox" id="related"> <span id="relatedLabel"></span></label></div><div id="findings"></div></section>
<section class="card"><h2 id="toolsTitle"></h2><div id="tools"></div></section><section class="card"><h2 id="limitsTitle"></h2><div id="limits"></div></section></div><footer class="footer">ForgeScope 0.1.0 · <a href="https://github.com/brunnojob/forgescope">Source & documentation</a> · MIT · No analytics or remote scripts.</footer></main>
<script id="report-data" type="application/json">/*REPORT_DATA*/null</script>
<script>
const report=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const labels={en:{eyebrow:'Local developer investigation',headline:'Understand the change. Follow the evidence.',intro:'Python impact analysis, diff review, CI diagnostics and repository maintenance in one report. Select a file to explore the import paths behind its potential impact.',stats:['Python modules','Changed / affected files','Test candidates','Review findings'],mapTitle:'What depends on this file?',selectLabel:'Start from',mapNote:'Arrows point from an importing file to the dependency. Import reachability does not prove a runtime failure.',testsTitle:'Tests to investigate',enginesTitle:'Integrated engines',findingsTitle:'Evidence and next steps',relatedLabel:'Related to changed files',toolsTitle:'RevScope · Suggested analysis tools',limitsTitle:'Coverage & limitations',none:'No matching evidence.',noTests:'No import-reachable tests found. This does not establish test coverage.',noTools:'No supported artifact signal detected. The tool catalog is guidance, not a binary analyzer.',chain:'Import path',unparsed:'Parse / resolution warnings',skipped:'Skipped files',dynamic:'Dynamic sites requiring manual review'},pt:{eyebrow:'Investigação local de código',headline:'Entenda a mudança. Siga as evidências.',intro:'Análise de impacto Python, revisão de diff, diagnóstico de CI e manutenção em um relatório. Selecione um arquivo para explorar os caminhos de importação e o impacto potencial.',stats:['Módulos Python','Arquivos alterados / afetados','Testes candidatos','Sinais para revisão'],mapTitle:'O que depende deste arquivo?',selectLabel:'Começar por',mapNote:'As setas apontam do importador para a dependência. Alcançabilidade por imports não prova falha em execução.',testsTitle:'Testes para investigar',enginesTitle:'Motores integrados',findingsTitle:'Evidências e próximos passos',relatedLabel:'Relacionados aos arquivos alterados',toolsTitle:'RevScope · Ferramentas sugeridas',limitsTitle:'Cobertura e limitações',none:'Nenhuma evidência correspondente.',noTests:'Nenhum teste alcançável por imports. Isso não estabelece cobertura.',noTools:'Nenhum sinal de artefato compatível. O catálogo orienta a análise; não analisa binários.',chain:'Caminho de importação',unparsed:'Avisos de análise / resolução',skipped:'Arquivos ignorados',dynamic:'Pontos dinâmicos para revisão manual'}};
let lang='en';
function reach(seed){const chains=new Map([[seed,[]]]),queue=[seed];while(queue.length){const target=queue.shift();for(const e of report.impact.edges.filter(e=>e.target===target)){if(!chains.has(e.source)){chains.set(e.source,[...chains.get(target),e]);queue.push(e.source)}}}return chains}
function drawMap(){const seed=$('seed').value,chains=reach(seed),svg=$('map');svg.replaceChildren();svg.setAttribute('viewBox','0 0 720 290');const ns='http://www.w3.org/2000/svg';const s=(tag,attrs)=>{let n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);return n};const defs=s('defs',{}),marker=s('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});marker.append(s('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#789b8e'}));defs.append(marker);svg.append(defs);const all=[...chains.keys()],shown=all.slice(0,8),positions=new Map();shown.forEach((p,i)=>positions.set(p,{x:i===0?360:80+(i-1)%3*270,y:i===0?40:120+Math.floor((i-1)/3)*70}));for(const e of report.impact.edges){if(!positions.has(e.source)||!positions.has(e.target))continue;const a=positions.get(e.source),b=positions.get(e.target);svg.append(s('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#56716b','stroke-width':2,'marker-end':'url(#arrow)'}));const t=s('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2});t.textContent='→';svg.append(t)}for(const[p,pos]of positions){svg.append(s('rect',{x:pos.x-77,y:pos.y-17,width:154,height:34,rx:6,fill:p===seed?'#244234':'#223046'}));const t=s('text',{x:pos.x,y:pos.y+4,'text-anchor':'middle'});t.style.fill='#eef8f1';t.textContent=p.length>22?'…'+p.slice(-21):p;const title=s('title',{});title.textContent=p;t.append(title);svg.append(t)}$('chains').replaceChildren();for(const[p,chain]of chains){if(!chain.length)continue;const div=el('div',undefined,'chain');div.append(el('strong',p));for(const e of [...chain].reverse())div.append(el('div',`${e.source}:${e.line} → ${e.target}`));$('chains').append(div)}if(all.length>8)$('chains').prepend(el('p',`${all.length} files; map previews 8. Full evidence below.`));}
function renderFindings(){const t=labels[lang],q=$('search').value.toLowerCase(),engine=$('filter').value,related=$('related').checked;const rows=report.findings.filter(f=>(engine==='all'||engine===f.engine)&&(!related||f.correlation)&&JSON.stringify(f).toLowerCase().includes(q));$('findings').replaceChildren();for(const f of rows){const card=el('article',undefined,'finding');card.append(el('span',f.engine,'pill'),el('span',f.priority,'pill high'));if(f.correlation)card.append(el('span',lang==='pt'?'Mesmo arquivo no impacto':'Same file in impact set','pill ok'));card.append(el('h3',f.title),el('code',`${f.path||'—'}${f.line?':'+f.line:''}`));const details=el('details');details.append(el('summary',lang==='pt'?'Evidência e ação (texto original do motor)':'Evidence & action'));details.append(el('p',f.evidence),el('p',f.action));card.append(details);$('findings').append(card)}if(!rows.length)$('findings').append(el('p',t.none));}
function render(){const t=labels[lang];document.documentElement.lang=lang;for(const id of ['eyebrow','headline','intro','mapTitle','selectLabel','mapNote','testsTitle','enginesTitle','findingsTitle','relatedLabel','toolsTitle','limitsTitle'])$(id).textContent=t[id];$('search').placeholder=lang==='pt'?'Pesquisar evidências':'Search evidence';$('filter').options[0].textContent=lang==='pt'?'Todos os motores':'All engines';$('status').textContent=report.project+' · '+(lang==='pt'?'Relatório local · evidências dos motores no idioma original':'Local report · engine evidence retains its original language');$('stats').replaceChildren();[report.impact.modules,report.impact.affected.length,report.impact.test_candidates.length,report.findings.length].forEach((v,i)=>{const d=el('div',undefined,'stat');d.append(el('strong',v),el('span',t.stats[i]));$('stats').append(d)});const previousSeed=$('seed').value;$('seed').replaceChildren();const paths=[...new Set([...report.impact.changed,...report.impact.symbols.map(s=>s.path)])];for(const p of paths){const o=el('option',p);o.value=p;$('seed').append(o)}$('seed').value=paths.includes(previousSeed)?previousSeed:(report.impact.changed.find(p=>p.endsWith('.py'))||paths[0]||'');$('tests').replaceChildren();if(!report.impact.test_candidates.length)$('tests').append(el('p',t.noTests,'muted'));else for(const p of report.impact.test_candidates)$('tests').append(el('p',p,'ok'));$('engines').replaceChildren();for(const[n,v]of Object.entries(report.engines))$('engines').append(el('p',`${n} · ${v.status}${v.error?' · '+v.error:''}`,v.status==='ok'?'ok':'high'));$('tools').replaceChildren();for(const tool of report.tools){const div=el('div',undefined,'tool'),a=el('a',tool.name);if(/^https:\/\//.test(tool.url)){a.href=tool.url;a.rel='noopener noreferrer';}div.append(a,el('p',tool.summary),el('small',tool.license+' · '+tool.platform));$('tools').append(div)}if(!report.tools.length)$('tools').append(el('p',t.noTools,'muted'));$('limits').replaceChildren();for(const x of report.limitations)$('limits').append(el('p',x,'muted'));$('limits').append(el('p',`${t.unparsed}: ${report.impact.warnings.length} · ${t.skipped}: ${report.inventory.skipped.length} · ${t.dynamic}: ${report.impact.dynamic_sites.length}`));const details=el('details');details.append(el('summary',lang==='pt'?'Ver inventário e avisos':'View inventory and warnings'),el('pre',JSON.stringify({warnings:report.impact.warnings,skipped:report.inventory.skipped,dynamic:report.impact.dynamic_sites},null,2)));details.style.overflow='auto';$('limits').append(details);drawMap();renderFindings()}
$('lang').onchange=()=>{lang=$('lang').value;render()};$('seed').onchange=drawMap;$('theme').onclick=()=>document.body.classList.toggle('light');$('search').oninput=renderFindings;$('filter').onchange=renderFindings;$('related').onchange=renderFindings;$('download').onclick=()=>{const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=el('a');a.href=u;a.download='forgescope-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};if(report)render();
</script></html>
