name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m forgescope examples/sample --diff examples/change.diff --log examples/build.log --output .forgescope --fail-on engine-error
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install --no-deps --force-reinstall .
      - name: Verify installed package outside source tree
        working-directory: ${{ runner.temp }}
        run: python -c "from forgescope.report import HERE; assert (HERE/'vendor/patchscope/engine.js').is_file(); assert (HERE/'viewer.html').is_file(); print(HERE)"
