name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      FORGESCOPE_CSHARP_WORKER: dotnet/ForgeScope.Worker/bin/Release/net10.0/ForgeScope.Worker.dll
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build dotnet/ForgeScope.Worker -c Release --nologo
      - run: dotnet build dotnet/ForgeScope.Workbench -c Release --nologo
      - run: dotnet dotnet/ForgeScope.Worker/bin/Release/net10.0/ForgeScope.Worker.dll --self-test
      - run: dotnet dotnet/ForgeScope.Workbench/bin/Release/net10.0/ForgeScope.Workbench.dll --self-test
      - run: java tools/Dependencies.java
      - run: java tools/Build.java test
      - run: java -jar build/forgescope.jar examples/sample --changed java/src/shop/Pricing.java --changed csharp/Pricing.cs --diff examples/change.diff --log examples/build.log --csharp-worker dotnet/ForgeScope.Worker/bin/Release/net10.0/ForgeScope.Worker.dll --history build/ci-history.sqlite --output .forgescope --fail-on engine-error
      - run: dotnet run --project dotnet/ForgeScope.Smoke -c Release -- dotnet/ForgeScope.Workbench/bin/Release/net10.0/ForgeScope.Workbench.dll .forgescope/report.json build/forgescope.jar dotnet/ForgeScope.Worker/bin/Release/net10.0/ForgeScope.Worker.dll
      - name: Verify optional Maven distribution
        if: runner.os == 'Linux'
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: forgescope-java-dotnet-${{ matrix.os }}
          path: |
            build/forgescope.jar
            build/lib/
            dotnet/ForgeScope.Worker/bin/Release/net10.0/
            dotnet/ForgeScope.Workbench/bin/Release/net10.0/
            .forgescope/report.json
            .forgescope/report.sarif
  policy-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forgescope_test
          POSTGRES_USER: forgescope
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U forgescope -d forgescope_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: policy-service/pom.xml
      - name: Verify merge policy and PostgreSQL audit
        run: mvn -B -f policy-service/pom.xml verify
        env:
          FORGESCOPE_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/forgescope_test
          FORGESCOPE_TEST_JDBC_USER: forgescope
          FORGESCOPE_TEST_JDBC_PASSWORD: ci-only-password
      - uses: actions/upload-artifact@v4
        with:
          name: forgescope-policy-service
          path: |
            policy-service/target/policy-service-*.jar
            policy-service/target/surefire-reports/
